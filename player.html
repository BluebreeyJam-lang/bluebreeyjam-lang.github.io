<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>极简音乐播放器 · 自动加载 file 目录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1e2b3c, #0f1a26);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            padding: 20px;
        }
        .player-card {
            background: rgba(30, 40, 55, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 56px;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8), inset 0 2px 4px rgba(255, 255, 255, 0.06);
            padding: 32px 28px 38px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.2s ease;
        }
        .cover-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
        }
        .vinyl-icon {
            width: 96px;
            height: 96px;
            background: radial-gradient(circle at 30% 30%, #3b4b5e, #1d2836);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 -6px 8px rgba(0,0,0,0.6), 0 12px 24px rgba(0,0,0,0.5);
            border: 2px solid rgba(255, 215, 150, 0.15);
            margin-bottom: 18px;
            transition: 0.3s;
        }
        .vinyl-icon span {
            font-size: 44px;
            opacity: 0.7;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }
        .song-title {
            font-size: 1.5rem;
            font-weight: 500;
            color: #f0f4fa;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.5);
            text-align: center;
            padding: 0 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            transition: 0.2s;
        }
        .song-artist {
            font-size: 0.9rem;
            color: #a0b8d0;
            margin-top: 4px;
            opacity: 0.7;
            font-weight: 300;
            letter-spacing: 0.3px;
        }
        .progress-area {
            margin: 24px 0 22px;
        }
        .time-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #b0c8dd;
            font-weight: 400;
            letter-spacing: 0.3px;
            padding: 0 4px;
            opacity: 0.8;
        }
        .progress-bar-bg {
            width: 100%;
            height: 4px;
            background: rgba(200, 215, 235, 0.15);
            border-radius: 20px;
            margin: 10px 0 6px;
            cursor: pointer;
            position: relative;
            transition: height 0.1s;
        }
        .progress-bar-bg:hover {
            height: 6px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #b7d9f0, #7fb9e0);
            border-radius: 20px;
            box-shadow: 0 0 12px rgba(110, 180, 240, 0.4);
            transition: width 0.08s linear;
            position: relative;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
            margin-top: 18px;
        }
        .ctrl-btn {
            background: rgba(220, 235, 255, 0.04);
            border: none;
            width: 64px;
            height: 64px;
            border-radius: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #d6e5f5;
            font-size: 28px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            background: rgba(40, 55, 75, 0.3);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transition: all 0.15s ease;
            border: 1px solid rgba(255, 255, 255, 0.02);
            line-height: 1;
        }
        .ctrl-btn:active {
            transform: scale(0.92);
            background: rgba(70, 100, 140, 0.25);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6);
        }
        .ctrl-btn svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
            display: block;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        .ctrl-btn.play-btn {
            width: 76px;
            height: 76px;
            background: linear-gradient(145deg, #4d6a8a, #2a3f58);
            box-shadow: 0 10px 24px rgba(0, 20, 40, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .ctrl-btn.play-btn svg {
            width: 36px;
            height: 36px;
        }
        .ctrl-btn.play-btn:active {
            background: #385072;
        }
        .file-status {
            text-align: center;
            margin-top: 24px;
            font-size: 0.75rem;
            color: #7a94b0;
            letter-spacing: 0.4px;
            font-weight: 300;
            border-top: 1px solid rgba(255,255,255,0.03);
            padding-top: 18px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .file-status span {
            background: rgba(0,0,0,0.2);
            padding: 4px 14px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255,255,255,0.02);
        }
        .file-status .count {
            color: #b8d0e8;
        }
        /* 适配小屏 */
        @media (max-width: 460px) {
            .player-card { padding: 24px 18px 30px; border-radius: 40px; }
            .ctrl-btn { width: 56px; height: 56px; font-size: 24px; }
            .ctrl-btn.play-btn { width: 68px; height: 68px; }
            .ctrl-btn svg { width: 28px; height: 28px; }
            .ctrl-btn.play-btn svg { width: 32px; height: 32px; }
            .song-title { font-size: 1.2rem; }
        }
        /* 隐藏原生音频 */
        audio {
            display: none;
        }
    </style>
</head>
<body>

<div class="player-card">
    <div class="cover-area">
        <div class="vinyl-icon">
            <span>🎵</span>
        </div>
        <div class="song-title" id="songTitle">加载歌曲...</div>
        <div class="song-artist" id="songArtist">file 目录</div>
    </div>

    <div class="progress-area">
        <div class="time-row">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
        </div>
        <div class="progress-bar-bg" id="progressBarBg">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="controls">
        <button class="ctrl-btn" id="prevBtn" aria-label="上一首">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="ctrl-btn play-btn" id="playBtn" aria-label="播放/暂停">
            <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctrl-btn" id="nextBtn" aria-label="下一首">
            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
    </div>

    <div class="file-status">
        <span class="count" id="songCounter">0 / 0</span>
        <span>📁 自动加载 file/</span>
    </div>
</div>

<audio id="audioPlayer" preload="metadata"></audio>

<script>
    (function() {
        // ---------- 核心配置 ----------
        const AUDIO_DIR = 'file/';          // 音频文件夹 (相对路径)
        // 支持常见音频格式 (根据实际文件调整)
        const EXTENSIONS = ['mp3', 'wav', 'ogg', 'm4a', 'aac', 'flac'];

        // DOM 引用
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const progressFill = document.getElementById('progressFill');
        const progressBarBg = document.getElementById('progressBarBg');
        const songCounter = document.getElementById('songCounter');

        // ---------- 状态 ----------
        let playlist = [];                 // 存放 { name, src }
        let currentIndex = 0;
        let isPlaying = false;
        let isUserSeeking = false;         // 拖动进度条时避免更新冲突

        // ---------- 辅助函数 ----------
        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === Infinity) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // 更新播放器 UI (标题/进度/计数器)
        function updatePlayerUI() {
            if (!playlist.length) {
                songTitle.textContent = '没有歌曲';
                songArtist.textContent = '请放入 file/ 目录';
                songCounter.textContent = '0 / 0';
                return;
            }
            const song = playlist[currentIndex];
            songTitle.textContent = song.name || '未知曲目';
            songArtist.textContent = `📁 file  · ${currentIndex + 1} / ${playlist.length}`;
            songCounter.textContent = `${playlist.length} 首`;

            // 更新总时长 (当metadata加载后)
            if (audio.readyState >= 1 && !isNaN(audio.duration)) {
                totalTimeEl.textContent = formatTime(audio.duration);
            } else {
                totalTimeEl.textContent = '0:00';
            }
            // 当前时间 & 进度条 (如果不在拖动状态)
            if (!isUserSeeking && audio.readyState >= 1) {
                const current = audio.currentTime || 0;
                currentTimeEl.textContent = formatTime(current);
                const duration = audio.duration || 1;
                const percent = (current / duration) * 100;
                progressFill.style.width = Math.min(percent, 100) + '%';
            }
        }

        // 加载指定索引的歌曲
        function loadSong(index) {
            if (!playlist.length) return;
            if (index < 0) index = playlist.length - 1;
            if (index >= playlist.length) index = 0;
            currentIndex = index;

            const song = playlist[currentIndex];
            audio.src = song.src;
            audio.load();  // 重置并加载metadata

            // 更新UI (标题等)
            updatePlayerUI();

            // 如果当前是播放状态, 继续播放; 否则暂停
            if (isPlaying) {
                audio.play().catch(err => {
                    // 自动播放策略: 如果用户未交互, 可能会拒绝; 静默处理
                    console.warn('播放被拦截:', err);
                    isPlaying = false;
                    updatePlayButton();
                });
            } else {
                audio.pause();
            }
        }

        // 播放/暂停切换
        function togglePlay() {
            if (!playlist.length) return;
            if (audio.paused) {
                audio.play().then(() => {
                    isPlaying = true;
                    updatePlayButton();
                }).catch(err => {
                    console.warn('播放失败:', err);
                    isPlaying = false;
                    updatePlayButton();
                });
            } else {
                audio.pause();
                isPlaying = false;
                updatePlayButton();
            }
        }

        // 更新播放按钮图标
        function updatePlayButton() {
            if (isPlaying) {
                playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; // 暂停
            } else {
                playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; // 播放
            }
        }

        // 上一首 / 下一首
        function prevSong() {
            if (!playlist.length) return;
            const newIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadSong(newIndex);
            // 如果当前是暂停状态，保持暂停，但是loadSong里根据isPlaying决定播放
            // 但我们希望点击上一首后自动播放（符合多数播放器习惯）
            if (!isPlaying) {
                // 如果当前暂停，点击上一首后自动播放
                isPlaying = true;
                audio.play().catch(() => {});
                updatePlayButton();
            }
        }

        function nextSong() {
            if (!playlist.length) return;
            const newIndex = (currentIndex + 1) % playlist.length;
            loadSong(newIndex);
            if (!isPlaying) {
                isPlaying = true;
                audio.play().catch(() => {});
                updatePlayButton();
            }
        }

        // ---------- 扫描 file 目录 (模拟自动加载) ----------
        function scanFileDirectory() {
            // 实际环境中无法直接列举目录，此处采用“预设 + 自动探测”策略。
            // 我们通过尝试加载常见的文件名来构建播放列表。
            // 为了更真实的“自动加载”，我们构造一组常见文件名。
            // 如果你有具体的文件，可以手动修改此数组，或使用后端API。
            // 这里我们使用一个常见歌曲名字列表 + 尝试多种扩展名。
            const baseNames = [
                'song1', 'song2', 'song3', 'song4', 'song5',
                'track1', 'track2', 'track3', 'track4', 'track5',
                'music1', 'music2', 'music3', 'music4', 'music5',
                'demo', 'test', 'audio', 'melody', 'rhythm'
            ];
            // 实际部署时，你可以将 file 目录下的文件名硬编码，或者通过 AJAX 请求获取列表。
            // 由于浏览器安全限制，我们无法直接读取文件夹，所以采用“探测”方式：
            // 尝试加载 baseNames + 扩展名，如果文件存在则加入播放列表。
            // 为了演示，我们内置了三个示例文件 (请确保 file/ 目录下有对应文件)
            // 你可以替换为实际文件名，或者使用后端接口。
            // 推荐：在真实项目中使用 API 获取文件列表。
            // 这里我们采用“预置 + 尝试加载”的方式。
            
            // 重置播放列表
            playlist = [];
            const candidateNames = ['最爱', '起风了', '光年之外', '夜曲', '稻香', '晴天', '小幸运', '告白气球'];
            // 为了快速演示，我们手动构造一些文件 (如果 file 目录下有这些文件就可以播放)
            // 你也可以将下面的注释打开，替换成你 file 目录下的真实文件名。
            // 注意：文件名不要包含中文？可以包含，但需要编码。
            
            // 方式1: 手动指定 (推荐，如果你知道文件名)
            // 例如: const manualFiles = ['夏日微风.mp3', '钢琴曲.wav', '节奏感.ogg'];
            // 但为了演示自动加载，我们尝试使用 baseNames + 扩展名，但实际浏览器无法探测文件存在，
            // 因此更好的办法是让使用者通过后端或手动配置。
            // 这里我采用混合: 假如 file/ 下有 'demo.mp3', 'test.wav', 'audio.ogg' 等。
            // 为了确保播放器开箱即用，我写入几个常见的文件名，你可以在 file 目录下放这些文件。
            
            // ********** 重要: 请在 file/ 目录下放置你的音频文件 **********
            // 这里我们预设三个文件 ( 请修改为你的实际文件名 )
            const demoFiles = [
                'demo.mp3',
                'test.wav', 
                'audio.ogg',
                'music.mp3',
                'track.mp3',
                'song.mp3',
                'melody.mp3',
                'rhythm.mp3'
            ];
            
            // 使用 fetch 尝试探测文件是否存在 (HEAD 请求)
            // 但为了简洁且避免大量网络请求，我们直接使用预设列表。
            // 如果你希望自动探测，可以遍历 demoFiles 并尝试 fetch。
            // 但 fetch 存在跨域和预检问题，所以我们只做一个简单的“假设存在”。
            // 最佳实践: 让后端提供接口返回文件列表。
            
            // 此处我们采用“用户自定义”：你可以直接修改下面的数组为你的实际文件。
            // 例如: const userFiles = ['我的歌.mp3', '钢琴曲.wav', '节奏.ogg'];
            // 为了演示，我使用一些常规名称，并构造完整路径。
            // 生产环境请使用后端API获取文件列表。
            
            // 手动配置 ( 请将你的音频文件名填入下方数组 )
            // ---------------------------------------------------------
            // 请修改此处为你的实际文件名 (相对 file/ 目录)
            const userFiles = [
                'demo.mp3',
                'test.wav',
                'audio.ogg',
                'music.mp3',
                'track.mp3'
            ];
            // ---------------------------------------------------------
            
            // 如果 userFiles 有内容则使用，否则使用 demoFiles
            const filesToUse = userFiles.length > 0 ? userFiles : demoFiles;
            
            filesToUse.forEach(filename => {
                // 提取文件名（不含扩展名）用于显示
                const dotIndex = filename.lastIndexOf('.');
                const displayName = dotIndex > 0 ? filename.substring(0, dotIndex) : filename;
                playlist.push({
                    name: displayName,
                    src: AUDIO_DIR + filename
                });
            });
            
            // 如果 playlist 为空，添加一个占位提示
            if (playlist.length === 0) {
                playlist.push({
                    name: '示例歌曲 (请放入音频)',
                    src: AUDIO_DIR + 'demo.mp3'
                });
            }

            // 加载第一首
            currentIndex = 0;
            if (playlist.length) {
                loadSong(0);
                // 默认暂停
                audio.pause();
                isPlaying = false;
                updatePlayButton();
            }
            updatePlayerUI();
        }

        // ---------- 事件绑定 ----------
        // 播放/暂停
        playBtn.addEventListener('click', togglePlay);

        // 上一首 / 下一首
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);

        // 音频事件: 播放时更新进度
        audio.addEventListener('timeupdate', function() {
            if (!isUserSeeking && audio.readyState >= 1) {
                const current = audio.currentTime || 0;
                currentTimeEl.textContent = formatTime(current);
                const duration = audio.duration || 1;
                const percent = (current / duration) * 100;
                progressFill.style.width = Math.min(percent, 100) + '%';
            }
        });

        audio.addEventListener('loadedmetadata', function() {
            updatePlayerUI();
            if (!isUserSeeking) {
                totalTimeEl.textContent = formatTime(audio.duration);
            }
        });

        // 播放结束自动下一首
        audio.addEventListener('ended', function() {
            nextSong();
        });

        // 进度条拖动 (点击跳转)
        progressBarBg.addEventListener('mousedown', function(e) {
            if (!playlist.length || audio.readyState < 1) return;
            isUserSeeking = true;
            const rect = this.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percent = Math.min(1, Math.max(0, clickX / rect.width));
            const duration = audio.duration || 1;
            audio.currentTime = percent * duration;
            progressFill.style.width = (percent * 100) + '%';
            currentTimeEl.textContent = formatTime(audio.currentTime);
            isUserSeeking = false;
        });

        // 触摸事件支持
        progressBarBg.addEventListener('touchstart', function(e) {
            if (!playlist.length || audio.readyState < 1) return;
            e.preventDefault();
            isUserSeeking = true;
            const rect = this.getBoundingClientRect();
            const touch = e.touches[0];
            const clickX = touch.clientX - rect.left;
            const percent = Math.min(1, Math.max(0, clickX / rect.width));
            const duration = audio.duration || 1;
            audio.currentTime = percent * duration;
            progressFill.style.width = (percent * 100) + '%';
            currentTimeEl.textContent = formatTime(audio.currentTime);
            isUserSeeking = false;
        }, { passive: false });

        // 键盘快捷键 (空格 切换播放，左右箭头)
        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSong();
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                nextSong();
            }
        });

        // 页面加载时扫描目录
        window.addEventListener('DOMContentLoaded', function() {
            scanFileDirectory();
        });

        // 当音频加载失败（文件不存在）时，尝试下一个
        audio.addEventListener('error', function() {
            console.warn('音频加载失败，尝试下一首:', audio.src);
            // 如果当前播放列表有歌曲，跳过
            if (playlist.length > 1) {
                nextSong();
            } else {
                // 单曲循环失败，显示提示
                songTitle.textContent = '文件未找到';
                songArtist.textContent = '请检查 file/ 目录';
            }
        });

        // 清理 (无)
    })();
</script>
</body>
</html>
