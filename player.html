<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎵 自动加载 · GitHub Pages 音乐播放器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1e2b3c, #0f1a26);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            padding: 20px;
        }
        .player-card {
            background: rgba(30, 40, 55, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 56px;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8), inset 0 2px 4px rgba(255, 255, 255, 0.06);
            padding: 32px 28px 30px;
            width: 100%;
            max-width: 480px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.2s ease;
        }
        .cover-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 18px;
        }
        .vinyl-icon {
            width: 96px;
            height: 96px;
            background: radial-gradient(circle at 30% 30%, #3b4b5e, #1d2836);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 -6px 8px rgba(0,0,0,0.6), 0 12px 24px rgba(0,0,0,0.5);
            border: 2px solid rgba(255, 215, 150, 0.15);
            margin-bottom: 16px;
            transition: 0.3s;
        }
        .vinyl-icon span {
            font-size: 44px;
            opacity: 0.7;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }
        .song-title {
            font-size: 1.5rem;
            font-weight: 500;
            color: #f0f4fa;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.5);
            text-align: center;
            padding: 0 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            transition: 0.2s;
        }
        .song-artist {
            font-size: 0.9rem;
            color: #a0b8d0;
            margin-top: 4px;
            opacity: 0.7;
            font-weight: 300;
            letter-spacing: 0.3px;
        }
        .playlist-area {
            margin: 14px 0 16px;
            max-height: 150px;
            overflow-y: auto;
            border-radius: 20px;
            background: rgba(0,0,0,0.25);
            padding: 6px 4px;
            scrollbar-width: thin;
            scrollbar-color: #4a6a8a transparent;
        }
        .playlist-area::-webkit-scrollbar {
            width: 4px;
        }
        .playlist-area::-webkit-scrollbar-thumb {
            background: #4a6a8a;
            border-radius: 20px;
        }
        .playlist-item {
            display: flex;
            align-items: center;
            padding: 8px 14px;
            border-radius: 40px;
            color: #c8d8ec;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s ease;
            gap: 10px;
            border: 1px solid transparent;
            margin-bottom: 2px;
        }
        .playlist-item:hover {
            background: rgba(255,255,255,0.04);
            border-color: rgba(255,255,255,0.03);
        }
        .playlist-item.active {
            background: rgba(70, 130, 200, 0.25);
            border-color: rgba(110, 180, 240, 0.2);
            color: #fff;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .playlist-item .index {
            opacity: 0.4;
            font-size: 0.7rem;
            min-width: 24px;
        }
        .playlist-item .name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .playlist-item .status-icon {
            font-size: 0.8rem;
            opacity: 0.6;
        }
        .progress-area {
            margin: 10px 0 14px;
        }
        .time-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #b0c8dd;
            font-weight: 400;
            letter-spacing: 0.3px;
            padding: 0 4px;
            opacity: 0.8;
        }
        .progress-bar-bg {
            width: 100%;
            height: 4px;
            background: rgba(200, 215, 235, 0.15);
            border-radius: 20px;
            margin: 10px 0 6px;
            cursor: pointer;
            position: relative;
            transition: height 0.1s;
        }
        .progress-bar-bg:hover {
            height: 6px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #b7d9f0, #7fb9e0);
            border-radius: 20px;
            box-shadow: 0 0 12px rgba(110, 180, 240, 0.4);
            transition: width 0.08s linear;
            position: relative;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
            margin-top: 8px;
        }
        .ctrl-btn {
            background: rgba(220, 235, 255, 0.04);
            border: none;
            width: 64px;
            height: 64px;
            border-radius: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #d6e5f5;
            font-size: 28px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            background: rgba(40, 55, 75, 0.3);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transition: all 0.15s ease;
            border: 1px solid rgba(255, 255, 255, 0.02);
            line-height: 1;
        }
        .ctrl-btn:active {
            transform: scale(0.92);
            background: rgba(70, 100, 140, 0.25);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6);
        }
        .ctrl-btn svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
            display: block;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        .ctrl-btn.play-btn {
            width: 76px;
            height: 76px;
            background: linear-gradient(145deg, #4d6a8a, #2a3f58);
            box-shadow: 0 10px 24px rgba(0, 20, 40, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .ctrl-btn.play-btn svg {
            width: 36px;
            height: 36px;
        }
        .ctrl-btn.play-btn:active {
            background: #385072;
        }
        .file-status {
            text-align: center;
            margin-top: 16px;
            font-size: 0.75rem;
            color: #7a94b0;
            letter-spacing: 0.4px;
            font-weight: 300;
            border-top: 1px solid rgba(255,255,255,0.03);
            padding-top: 14px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .file-status span {
            background: rgba(0,0,0,0.2);
            padding: 4px 14px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255,255,255,0.02);
        }
        .file-status .count {
            color: #b8d0e8;
        }
        .file-status .api-info {
            color: #7fb9e0;
            font-size: 0.65rem;
        }
        audio {
            display: none;
        }
        @media (max-width: 460px) {
            .player-card { padding: 22px 16px 22px; border-radius: 40px; }
            .ctrl-btn { width: 56px; height: 56px; font-size: 24px; }
            .ctrl-btn.play-btn { width: 68px; height: 68px; }
            .ctrl-btn svg { width: 28px; height: 28px; }
            .ctrl-btn.play-btn svg { width: 32px; height: 32px; }
            .song-title { font-size: 1.2rem; }
            .playlist-area { max-height: 120px; }
            .playlist-item { padding: 6px 12px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<div class="player-card">
    <div class="cover-area">
        <div class="vinyl-icon"><span>🎵</span></div>
        <div class="song-title" id="songTitle">加载歌曲...</div>
        <div class="song-artist" id="songArtist">GitHub API 自动扫描</div>
    </div>

    <!-- 播放列表 -->
    <div class="playlist-area" id="playlistContainer">
        <div class="playlist-item" style="opacity:0.5;justify-content:center;">扫描中...</div>
    </div>

    <div class="progress-area">
        <div class="time-row">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
        </div>
        <div class="progress-bar-bg" id="progressBarBg">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="controls">
        <button class="ctrl-btn" id="prevBtn" aria-label="上一首">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="ctrl-btn play-btn" id="playBtn" aria-label="播放/暂停">
            <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctrl-btn" id="nextBtn" aria-label="下一首">
            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
    </div>

    <div class="file-status">
        <span class="count" id="songCounter">0 首</span>
        <span>📁 file/ 目录</span>
        <span id="scanStatus">🔄 正在扫描...</span>
        <span class="api-info" id="apiInfo">🌐 GitHub API</span>
    </div>
</div>

<audio id="audioPlayer" preload="metadata"></audio>

<script>
    (function() {
        // ============================================================
        //  配置
        // ============================================================
        const AUDIO_DIR = 'file/';
        const SUPPORTED_EXT = ['mp3', 'wav', 'ogg', 'm4a', 'aac', 'flac', 'webm'];

        // ============================================================
        //  DOM 引用
        // ============================================================
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const progressFill = document.getElementById('progressFill');
        const progressBarBg = document.getElementById('progressBarBg');
        const songCounter = document.getElementById('songCounter');
        const playlistContainer = document.getElementById('playlistContainer');
        const scanStatus = document.getElementById('scanStatus');
        const apiInfo = document.getElementById('apiInfo');

        // ============================================================
        //  状态
        // ============================================================
        let playlist = [];
        let currentIndex = 0;
        let isPlaying = false;
        let isUserSeeking = false;

        // ============================================================
        //  工具函数
        // ============================================================
        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === Infinity) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function getRepoInfo() {
            // 从当前 URL 提取 GitHub 仓库信息
            // 格式: https://用户名.github.io/仓库名/ 或 自定义域名
            const url = window.location.href;
            const match = url.match(/github\.io\/([^\/]+)(?:\/([^\/]+))?/);
            if (match) {
                const owner = match[1];
                const repo = match[2] || owner; // 如果仓库名和用户名相同
                return { owner, repo };
            }
            // 如果是自定义域名，尝试从路径获取
            const pathMatch = window.location.pathname.match(/^\/([^\/]+)/);
            if (pathMatch) {
                // 这种情况无法准确获取 owner，返回 null
                return null;
            }
            return null;
        }

        // ============================================================
        //  渲染播放列表
        // ============================================================
        function renderPlaylist(activeIndex) {
            if (!playlistContainer) return;
            if (!playlist.length) {
                playlistContainer.innerHTML = `<div class="playlist-item" style="opacity:0.5;justify-content:center;">暂无音频文件</div>`;
                return;
            }
            let html = '';
            playlist.forEach((item, idx) => {
                const activeClass = (idx === activeIndex) ? 'active' : '';
                const icon = (idx === activeIndex) ? (isPlaying ? '▶️' : '⏸️') : '🎵';
                html += `
                    <div class="playlist-item ${activeClass}" data-index="${idx}">
                        <span class="index">${idx + 1}</span>
                        <span class="name">${item.name}</span>
                        <span class="status-icon">${icon}</span>
                    </div>
                `;
            });
            playlistContainer.innerHTML = html;

            playlistContainer.querySelectorAll('.playlist-item').forEach(el => {
                el.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index, 10);
                    if (!isNaN(idx) && idx !== currentIndex) {
                        loadSong(idx);
                        if (!isPlaying) {
                            isPlaying = true;
                            audio.play().catch(() => {});
                            updatePlayButton();
                        }
                    } else if (idx === currentIndex) {
                        togglePlay();
                    }
                });
            });
        }

        // ============================================================
        //  UI 更新
        // ============================================================
        function updateUI() {
            if (!playlist.length) {
                songTitle.textContent = '没有歌曲';
                songArtist.textContent = '请检查 file/ 目录';
                songCounter.textContent = '0 首';
                renderPlaylist(-1);
                return;
            }
            const song = playlist[currentIndex];
            songTitle.textContent = song.name || '未知曲目';
            songArtist.textContent = `📁 file  · ${currentIndex + 1} / ${playlist.length}`;
            songCounter.textContent = `${playlist.length} 首`;
            renderPlaylist(currentIndex);

            if (audio.readyState >= 1 && !isNaN(audio.duration)) {
                totalTimeEl.textContent = formatTime(audio.duration);
            } else {
                totalTimeEl.textContent = '0:00';
            }
            if (!isUserSeeking && audio.readyState >= 1) {
                const current = audio.currentTime || 0;
                currentTimeEl.textContent = formatTime(current);
                const duration = audio.duration || 1;
                const percent = (current / duration) * 100;
                progressFill.style.width = Math.min(percent, 100) + '%';
            }
        }

        // ============================================================
        //  播放控制
        // ============================================================
        function loadSong(index) {
            if (!playlist.length) return;
            if (index < 0) index = playlist.length - 1;
            if (index >= playlist.length) index = 0;
            currentIndex = index;
            const song = playlist[currentIndex];
            audio.src = song.src;
            audio.load();
            updateUI();
            if (isPlaying) {
                audio.play().catch(err => {
                    console.warn('播放被拦截:', err);
                    isPlaying = false;
                    updatePlayButton();
                    updateUI();
                });
            } else {
                audio.pause();
            }
        }

        function togglePlay() {
            if (!playlist.length) return;
            if (audio.paused) {
                audio.play().then(() => {
                    isPlaying = true;
                    updatePlayButton();
                    updateUI();
                }).catch(err => {
                    console.warn('播放失败:', err);
                    isPlaying = false;
                    updatePlayButton();
                    updateUI();
                });
            } else {
                audio.pause();
                isPlaying = false;
                updatePlayButton();
                updateUI();
            }
        }

        function updatePlayButton() {
            if (isPlaying) {
                playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            } else {
                playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
            }
            renderPlaylist(currentIndex);
        }

        function prevSong() {
            if (!playlist.length) return;
            const newIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadSong(newIndex);
            if (!isPlaying) {
                isPlaying = true;
                audio.play().catch(() => {});
                updatePlayButton();
                updateUI();
            }
        }

        function nextSong() {
            if (!playlist.length) return;
            const newIndex = (currentIndex + 1) % playlist.length;
            loadSong(newIndex);
            if (!isPlaying) {
                isPlaying = true;
                audio.play().catch(() => {});
                updatePlayButton();
                updateUI();
            }
        }

        // ============================================================
        //  🔥 核心：通过 GitHub API 自动扫描 file/ 目录
        // ============================================================
        async function scanWithGitHubAPI() {
            scanStatus.textContent = '🔄 正在连接 GitHub API...';
            apiInfo.textContent = '🌐 GitHub API';
            playlist = [];

            const repoInfo = getRepoInfo();
            if (!repoInfo) {
                scanStatus.textContent = '⚠️ 无法识别仓库';
                apiInfo.textContent = '❌ 请使用 GitHub Pages 域名';
                fallbackToManual();
                return;
            }

            const { owner, repo } = repoInfo;
            // 注意：GitHub API 路径是 /repos/{owner}/{repo}/contents/{path}
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${AUDIO_DIR}`;

            try {
                const response = await fetch(apiUrl, {
                    headers: {
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (response.status === 403) {
                    // API 限流
                    scanStatus.textContent = '⚠️ API 限流，使用备用列表';
                    apiInfo.textContent = '⏳ 请稍后再试';
                    fallbackToManual();
                    return;
                }

                if (response.status === 404) {
                    scanStatus.textContent = '❌ file/ 目录不存在';
                    apiInfo.textContent = '📁 请创建 file/ 目录';
                    fallbackToManual();
                    return;
                }

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                if (!Array.isArray(data)) {
                    // 可能是单个文件响应
                    scanStatus.textContent = '⚠️ 目录为空或格式错误';
                    fallbackToManual();
                    return;
                }

                // 过滤出音频文件
                const audioFiles = data.filter(item => {
                    if (item.type !== 'file') return false;
                    const ext = item.name.split('.').pop().toLowerCase();
                    return SUPPORTED_EXT.includes(ext);
                });

                if (audioFiles.length === 0) {
                    scanStatus.textContent = '⚠️ 未找到音频文件';
                    apiInfo.textContent = '📁 请放入音频文件';
                    fallbackToManual();
                    return;
                }

                audioFiles.forEach(item => {
                    const name = item.name.replace(/\.[^/.]+$/, '');
                    playlist.push({
                        name: decodeURIComponent(name),
                        src: AUDIO_DIR + item.name
                    });
                });

                scanStatus.textContent = `✅ 扫描到 ${playlist.length} 个音频文件`;
                apiInfo.textContent = `📊 GitHub API · ${playlist.length} 首`;

            } catch (error) {
                console.error('GitHub API 请求失败:', error);
                scanStatus.textContent = '⚠️ 请求失败，使用备用列表';
                apiInfo.textContent = '🌐 网络错误';
                fallbackToManual();
            }

            // 加载第一首
            if (playlist.length === 0) {
                fallbackToManual();
            } else {
                finishLoading();
            }
        }

        // ============================================================
        //  备用方案：手动列表（作为 fallback）
        // ============================================================
        function fallbackToManual() {
            // 👇👇👇 在这里修改你的备用文件列表 👇👇👇
            const fallbackFiles = [
                'demo.mp3',
                'test.wav',
                'audio.ogg',
                'music.mp3',
                'track.mp3'
            ];

            playlist = [];
            fallbackFiles.forEach(filename => {
                const ext = filename.split('.').pop().toLowerCase();
                if (SUPPORTED_EXT.includes(ext)) {
                    const name = filename.replace(/\.[^/.]+$/, '');
                    playlist.push({
                        name: decodeURIComponent(name),
                        src: AUDIO_DIR + filename
                    });
                }
            });

            if (playlist.length === 0) {
                playlist.push({
                    name: '请放入音频文件到 file/ 目录',
                    src: AUDIO_DIR + 'demo.mp3'
                });
                scanStatus.textContent = '📂 无文件，使用占位';
            } else {
                scanStatus.textContent = `📂 备用列表 (${playlist.length} 首)`;
            }
            finishLoading();
        }

        // ============================================================
        //  完成加载
        // ============================================================
        function finishLoading() {
            currentIndex = 0;
            if (playlist.length) {
                loadSong(0);
                audio.pause();
                isPlaying = false;
                updatePlayButton();
                updateUI();
            }
            renderPlaylist(currentIndex);
        }

        // ============================================================
        //  事件绑定
        // ============================================================
        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);

        audio.addEventListener('timeupdate', function() {
            if (!isUserSeeking && audio.readyState >= 1) {
                const current = audio.currentTime || 0;
                currentTimeEl.textContent = formatTime(current);
                const duration = audio.duration || 1;
                const percent = (current / duration) * 100;
                progressFill.style.width = Math.min(percent, 100) + '%';
            }
        });

        audio.addEventListener('loadedmetadata', function() {
            updateUI();
            if (!isUserSeeking) {
                totalTimeEl.textContent = formatTime(audio.duration);
            }
        });

        audio.addEventListener('ended', function() {
            nextSong();
        });

        // 进度条拖动
        progressBarBg.addEventListener('mousedown', function(e) {
            if (!playlist.length || audio.readyState < 1) return;
            isUserSeeking = true;
            const rect = this.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percent = Math.min(1, Math.max(0, clickX / rect.width));
            const duration = audio.duration || 1;
            audio.currentTime = percent * duration;
            progressFill.style.width = (percent * 100) + '%';
            currentTimeEl.textContent = formatTime(audio.currentTime);
            isUserSeeking = false;
        });

        progressBarBg.addEventListener('touchstart', function(e) {
            if (!playlist.length || audio.readyState < 1) return;
            e.preventDefault();
            isUserSeeking = true;
            const rect = this.getBoundingClientRect();
            const touch = e.touches[0];
            const clickX = touch.clientX - rect.left;
            const percent = Math.min(1, Math.max(0, clickX / rect.width));
            const duration = audio.duration || 1;
            audio.currentTime = percent * duration;
            progressFill.style.width = (percent * 100) + '%';
            currentTimeEl.textContent = formatTime(audio.currentTime);
            isUserSeeking = false;
        }, { passive: false });

        // 键盘快捷键
        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSong();
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                nextSong();
            }
        });

        // 音频错误自动跳过
        audio.addEventListener('error', function() {
            console.warn('音频加载失败:', audio.src);
            if (playlist.length > 1) {
                const nextIdx = (currentIndex + 1) % playlist.length;
                loadSong(nextIdx);
            }
        });

        // ============================================================
        //  🚀 启动：优先使用 GitHub API
        // ============================================================
        window.addEventListener('DOMContentLoaded', function() {
            // 检查是否在 GitHub Pages 环境
            const isGitHubPages = window.location.hostname.includes('github.io');
            if (isGitHubPages) {
                scanWithGitHubAPI();
            } else {
                // 本地测试或其他环境，直接使用备用列表
                scanStatus.textContent = '📂 本地模式';
                apiInfo.textContent = '💻 使用备用列表';
                fallbackToManual();
            }
        });

    })();
</script>
</body>
</html>
