<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频播放器</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #1e2b3a 0%, #0f1722 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .player-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 40px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 520px;
            transition: all 0.2s ease;
        }
        h2 {
            color: #e2e8f0;
            font-weight: 500;
            font-size: 1.5rem;
            letter-spacing: 0.5px;
            margin: 0 0 8px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h2 small {
            font-size: 0.85rem;
            font-weight: 400;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 14px;
            border-radius: 40px;
            letter-spacing: 0.3px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin: 0 0 28px 0;
            border-left: 3px solid #38bdf8;
            padding-left: 16px;
            background: rgba(56, 189, 248, 0.04);
            border-radius: 0 12px 12px 0;
        }
        .player-group {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .audio-item {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 28px;
            padding: 18px 20px 20px 20px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: inset 0 2px 3px rgba(0,0,0,0.4);
            transition: 0.15s;
        }
        .audio-item:hover {
            background: rgba(30, 41, 59, 0.8);
            border-color: rgba(56, 189, 248, 0.2);
        }
        .track-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 10px;
            letter-spacing: 0.3px;
        }
        .track-label span {
            background: #38bdf8;
            color: #0f1722;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0 12px;
            border-radius: 40px;
            line-height: 1.6;
            margin-left: 4px;
        }
        .track-label i {
            font-style: normal;
            opacity: 0.6;
        }
        audio {
            width: 100%;
            height: 44px;
            border-radius: 60px;
            background: #0b121c;
            outline: none;
            display: block;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
        }
        audio::-webkit-media-controls-panel {
            background: #1e293b;
            border-radius: 60px;
        }
        audio::-webkit-media-controls-play-button {
            background-color: #38bdf8;
            border-radius: 50%;
            transition: 0.15s;
        }
        audio::-webkit-media-controls-play-button:hover {
            background-color: #7dd3fc;
            transform: scale(1.02);
        }
        audio::-webkit-media-controls-timeline {
            background-color: #334155;
            border-radius: 12px;
            height: 4px;
        }
        audio::-webkit-media-controls-current-time-display,
        audio::-webkit-media-controls-time-remaining-display {
            color: #e2e8f0;
            font-weight: 400;
        }
        .status-badge {
            display: inline-block;
            margin-top: 10px;
            font-size: 0.7rem;
            color: #94a3b8;
            background: rgba(0,0,0,0.3);
            padding: 2px 14px;
            border-radius: 40px;
            letter-spacing: 0.3px;
            border: 1px solid rgba(255,255,255,0.02);
        }
        .status-badge.active {
            color: #7dd3fc;
            border-color: #38bdf866;
            background: rgba(56, 189, 248, 0.08);
        }
        .footer-note {
            margin-top: 24px;
            color: #64748b;
            font-size: 0.75rem;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 18px;
            letter-spacing: 0.2px;
        }
        .footer-note strong {
            color: #94a3b8;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="player-card">
    <h2>
        🎧 独占播放
        <small>单线程</small>
    </h2>
    <div class="subtitle">
        ⚡ 同时只能播放一个音频 · 自动暂停其他
    </div>

    <div class="player-group">
        <!-- 音频 1: despair syndrome -->
        <div class="audio-item" data-track="despair">
            <div class="track-label">
                <span>🎵</span> Despair Syndrome
                <span>M4A</span>
                <i style="margin-left: auto; opacity:0.5;">#1</i>
            </div>
            <audio controls preload="metadata" src="file/despairsyndrome.m4a">
                您的浏览器不支持 audio 元素。
            </audio>
            <div class="status-badge" id="status-despair">⏸ 停止</div>
        </div>

        <!-- 音频 2: visitor from underground -->
        <div class="audio-item" data-track="visitor">
            <div class="track-label">
                <span>🎵</span> Visitor from Underground
                <span>MP3</span>
                <i style="margin-left: auto; opacity:0.5;">#2</i>
            </div>
            <audio controls preload="metadata" src="file/visitorfromunderground.mp3">
                您的浏览器不支持 audio 元素。
            </audio>
            <div class="status-badge" id="status-visitor">⏸ 停止</div>
        </div>
    </div>

    <div class="footer-note">
        <strong>🔇 独占模式</strong> · 点击任意播放按钮，其他音频自动暂停
    </div>
</div>

<script>
    (function() {
        "use strict";

        // 获取所有 audio 元素
        const audioElements = document.querySelectorAll('audio');
        // 用于存储每个 audio 对应的状态元素 (status badge)
        const statusMap = new Map();

        // 初始化 statusMap 和 状态显示
        audioElements.forEach((audio, index) => {
            // 通过父级 .audio-item 内的 .status-badge 来定位
            const parentItem = audio.closest('.audio-item');
            if (parentItem) {
                const badge = parentItem.querySelector('.status-badge');
                if (badge) {
                    statusMap.set(audio, badge);
                    // 初始状态
                    updateStatusBadge(audio, badge);
                }
            }

            // 为每个 audio 绑定 play 事件 (捕获阶段拦截)
            audio.addEventListener('play', function(e) {
                // 当这个音频开始播放时，暂停其他所有音频
                audioElements.forEach(otherAudio => {
                    if (otherAudio !== audio && !otherAudio.paused) {
                        otherAudio.pause();
                        // 更新被暂停的音频的 status badge
                        const otherBadge = statusMap.get(otherAudio);
                        if (otherBadge) {
                            updateStatusBadge(otherAudio, otherBadge);
                        }
                    }
                });

                // 更新当前播放音频的 status badge
                const currentBadge = statusMap.get(audio);
                if (currentBadge) {
                    updateStatusBadge(audio, currentBadge);
                }
            }, false);

            // 监听 pause 事件，更新状态 (包括用户手动暂停、被代码暂停)
            audio.addEventListener('pause', function(e) {
                const badge = statusMap.get(audio);
                if (badge) {
                    updateStatusBadge(audio, badge);
                }
            }, false);

            // 监听 ended 事件，确保状态重置 (音频播放结束)
            audio.addEventListener('ended', function(e) {
                const badge = statusMap.get(audio);
                if (badge) {
                    updateStatusBadge(audio, badge);
                }
            }, false);
        });

        // 辅助函数：根据 audio 的 paused 状态更新 badge 文字和样式
        function updateStatusBadge(audioElement, badgeElement) {
            if (!badgeElement) return;
            if (audioElement.paused) {
                // 检查是否是因为播放结束而暂停 (currentTime 接近 duration 且 duration 不是 NaN)
                if (audioElement.duration && !isNaN(audioElement.duration) && 
                    audioElement.currentTime >= audioElement.duration - 0.1) {
                    badgeElement.textContent = '✅ 已结束';
                    badgeElement.classList.remove('active');
                } else {
                    badgeElement.textContent = '⏸ 停止';
                    badgeElement.classList.remove('active');
                }
            } else {
                badgeElement.textContent = '▶ 播放中';
                badgeElement.classList.add('active');
            }
        }

        // 额外保护：如果有音频在页面加载时已经开始播放 (比如 autoplay 或预加载)，我们需要同步状态
        // 但一般不会，不过还是做一次初始化扫描
        window.addEventListener('load', function() {
            audioElements.forEach(audio => {
                const badge = statusMap.get(audio);
                if (badge) {
                    updateStatusBadge(audio, badge);
                }
                // 如果加载后音频意外播放（比如浏览器记住状态），强制暂停其他？
                // 为了稳健，如果多个音频同时处于播放状态，只保留第一个
                if (!audio.paused) {
                    // 找到所有播放的音频，保留第一个，暂停其余
                    const playingAudios = Array.from(audioElements).filter(a => !a.paused);
                    if (playingAudios.length > 1) {
                        // 保留第一个，暂停其他的
                        const first = playingAudios[0];
                        playingAudios.forEach((a, idx) => {
                            if (idx > 0 && a !== first) {
                                a.pause();
                                const b = statusMap.get(a);
                                if (b) updateStatusBadge(a, b);
                            }
                        });
                        // 更新第一个的状态
                        const firstBadge = statusMap.get(first);
                        if (firstBadge) updateStatusBadge(first, firstBadge);
                    }
                }
            });
        });

        // 小细节: 如果用户通过浏览器开发者工具或其他方式触发 play，我们的监听器依然有效
        // 同时捕获可能因为 preload 引起的异常，但无伤大雅

        console.log('🎵 独占播放模式已激活 —— 同时只能播放一个音频');
    })();
</script>

</body>
</html>
