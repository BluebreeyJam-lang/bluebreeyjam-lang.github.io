<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>player</title>
</head>
<body>

<div class="player-card">
    <h1>there are some music </h1>
    <h2>you can play them</h2>
    <div class="player-group">
        <div class="audio-item" data-track="audio1">
            <audio controls preload="metadata" src="file/despairsyndrome.m4a">
                您的浏览器不支持 audio 元素。
            </audio>
        </div>

        <div class="audio-item" data-track="audio2">
            <audio controls preload="metadata" src="file/visitorfromunderground.mp3">
                您的浏览器不支持 audio 元素。
            </audio>
        </div>

        <div class="player-group">
        <div class="audio-item" data-track="audio3">
            <audio controls preload="metadata" src="file/dawnlovania.mp3">
                您的浏览器不支持 audio 元素。
            </audio>
        </div>

        <div class="player-group">
        <div class="audio-item" data-track="audio4">
            <audio controls preload="metadata" src="file/vttp4.mp3">
                您的浏览器不支持 audio 元素。
            </audio>
        </div>

        <div class="player-group">
        <div class="audio-item" data-track="audio5">
            <audio controls preload="metadata" src="file/skfttp1.mp3">
                您的浏览器不支持 audio 元素。
            </audio>
        </div>    

        <div class="player-group">
        <div class="audio-item" data-track="audio6">
            <audio controls preload="metadata" src="file/headtohead.mp3">
                您的浏览器不支持 audio 元素。
            </audio>
        </div>    
    </div>
</div>

<script>
    (function() {
        "use strict";
        const audioElements = document.querySelectorAll('audio');
        const statusMap = new Map();
        audioElements.forEach((audio, index) => {
            const parentItem = audio.closest('.audio-item');
            if (parentItem) {
                const badge = parentItem.querySelector('.status-badge');
                if (badge) {
                    statusMap.set(audio, badge);
                    updateStatusBadge(audio, badge);
                }
            }
            audio.addEventListener('play', function(e) {
                audioElements.forEach(otherAudio => {
                    if (otherAudio !== audio && !otherAudio.paused) {
                        otherAudio.pause();
                        const otherBadge = statusMap.get(otherAudio);
                        if (otherBadge) {
                            updateStatusBadge(otherAudio, otherBadge);
                        }
                    }
                });
                const currentBadge = statusMap.get(audio);
                if (currentBadge) {
                    updateStatusBadge(audio, currentBadge);
                }
            }, false);
            audio.addEventListener('pause', function(e) {
                const badge = statusMap.get(audio);
                if (badge) {
                    updateStatusBadge(audio, badge);
                }
            }, false);
            audio.addEventListener('ended', function(e) {
                const badge = statusMap.get(audio);
                if (badge) {
                    updateStatusBadge(audio, badge);
                }
            }, false);
        });
        function updateStatusBadge(audioElement, badgeElement) {
            if (!badgeElement) return;
            if (audioElement.paused) {
                if (audioElement.duration && !isNaN(audioElement.duration) && 
                    audioElement.currentTime >= audioElement.duration - 0.1) {
                    badgeElement.textContent = '已结束';
                    badgeElement.classList.remove('active');
                } else {
                    badgeElement.textContent = '停止';
                    badgeElement.classList.remove('active');
                }
            } else {
                badgeElement.textContent = '播放中';
                badgeElement.classList.add('active');
            }
        }
        window.addEventListener('load', function() {
            audioElements.forEach(audio => {
                const badge = statusMap.get(audio);
                if (badge) {
                    updateStatusBadge(audio, badge);
                }
                if (!audio.paused) {
                    const playingAudios = Array.from(audioElements).filter(a => !a.paused);
                    if (playingAudios.length > 1) {
                        const first = playingAudios[0];
                        playingAudios.forEach((a, idx) => {
                            if (idx > 0 && a !== first) {
                                a.pause();
                                const b = statusMap.get(a);
                                if (b) updateStatusBadge(a, b);
                            }
                        });
                        const firstBadge = statusMap.get(first);
                        if (firstBadge) updateStatusBadge(first, firstBadge);
                    }
                }
            });
        });
    })();
</script>
</body>
</html>
